services:
  - type: web
    name: acrophase-backend
    runtime: docker
    rootDir: acrophase-backend-main
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://jcjqskabyzuvcbsxlhhv.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: acrophase-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_EMAIL
        value: admin@acrophase.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: System Admin
      - key: VALD_CLIENT_ID
        sync: false
      - key: VALD_CLIENT_SECRET
        sync: false
      - key: VALD_AUTH_URL
        value: https://auth.prd.vald.com/oauth/token
      - key: VALD_AUDIENCE
        value: vald-api-external
      - key: VALD_REGION
        value: aue
      - key: VALD_SUPABASE_URL
        value: https://jcjqskabyzuvcbsxlhhv.supabase.co
      - key: VALD_SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: acrophase-frontend
    runtime: static
    rootDir: acrophase-frontend-main
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: acrophase-backend
          envVarKey: RENDER_EXTERNAL_URL
